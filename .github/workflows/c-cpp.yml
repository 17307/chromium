name: Build Chromium

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
      # 检出代码
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  
          fetch-tags: true

      # 设置必要的软件和依赖
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git python3 python3-pip python3-venv ninja-build clang lld

      # 克隆 Chromium 源代码
      - name: Fetch Chromium Source Code
        run: |
          ./build/install-build-deps.sh --no-prompt
          gclient sync

      # 配置编译选项
      - name: Configure Build
        run: |
          cd chromium/src
          gn gen out/Default --args='is_debug=false is_official_build=true symbol_level=0'

      # 编译 Chromium
      - name: Build Chromium
        run: |
          cd chromium/src
          autoninja -C out/Default chrome

      # 上传编译结果
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: chromium-build
          path: chromium/src/out/Default
